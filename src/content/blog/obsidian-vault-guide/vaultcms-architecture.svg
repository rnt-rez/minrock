<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="960" height="480" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="2" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.1" stroke="#94a3b8" stroke-width="1">
    <line x1="0" y1="80" x2="960" y2="80" />
    <line x1="0" y1="160" x2="960" y2="160" />
    <line x1="0" y1="240" x2="960" y2="240" />
    <line x1="0" y1="320" x2="960" y2="320" />
    <line x1="0" y1="400" x2="960" y2="400" />
    <line x1="160" y1="0" x2="160" y2="480" />
    <line x1="320" y1="0" x2="320" y2="480" />
    <line x1="480" y1="0" x2="480" y2="480" />
    <line x1="640" y1="0" x2="640" y2="480" />
    <line x1="800" y1="0" x2="800" y2="480" />
  </g>

  <!-- Title Header -->
  <text x="480" y="55" text-anchor="middle" font-family="system-ui, sans-serif" font-size="22" font-weight="700" fill="#f8fafc" letter-spacing="-0.5">
    Minrock + Obsidian Vault CMS Architecture
  </text>
  <text x="480" y="80" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="400" fill="#94a3b8">
    Zero-Friction Desktop Publishing Pipeline with Atomic Page Bundles
  </text>

  <!-- Step 1: Obsidian Vault Card -->
  <g transform="translate(60, 130)">
    <rect width="240" height="260" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="2" filter="url(#glow)" opacity="0.9" />
    <rect width="240" height="260" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="40" cy="40" r="18" fill="#38bdf8" opacity="0.15" />
    <text x="40" y="46" text-anchor="middle" font-size="18">💎</text>
    <text x="70" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Obsidian Vault</text>
    <text x="70" y="60" font-family="monospace" font-size="11" fill="#38bdf8">src/content/</text>

    <!-- Sub-items -->
    <rect x="20" y="85" width="200" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="106" font-family="monospace" font-size="11" fill="#cbd5e1">📁 blog/post/index.md</text>

    <rect x="20" y="128" width="200" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="149" font-family="monospace" font-size="11" fill="#cbd5e1">🖼️ Ctrl+V image pasted</text>

    <rect x="20" y="171" width="200" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="192" font-family="monospace" font-size="11" fill="#cbd5e1">⚙️ .obsidian/ (Pre-set)</text>

    <rect x="20" y="214" width="200" height="30" rx="6" fill="#2563eb" opacity="0.2" />
    <text x="120" y="233" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#60a5fa">1-Click Git Push</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <g transform="translate(310, 245)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#38bdf8" stroke-width="3" stroke-dasharray="4 4" />
    <polygon points="45,0 35,-6 35,6" fill="#38bdf8" />
  </g>

  <!-- Step 2: Astro 7 Compiler Card -->
  <g transform="translate(360, 130)">
    <rect width="240" height="260" rx="12" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="2" filter="url(#glow)" opacity="0.9" />
    <rect width="240" height="260" rx="12" fill="url(#cardGrad)" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="40" cy="40" r="18" fill="#f43f5e" opacity="0.15" />
    <text x="40" y="46" text-anchor="middle" font-size="18">🚀</text>
    <text x="70" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Astro 7 Sätteri</text>
    <text x="70" y="60" font-family="monospace" font-size="11" fill="#f43f5e">Static Compiler</text>

    <!-- Sub-items -->
    <rect x="20" y="85" width="200" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="106" font-family="monospace" font-size="11" fill="#cbd5e1">⚡ Sätteri Rust Core</text>

    <rect x="20" y="128" width="200" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="149" font-family="monospace" font-size="11" fill="#cbd5e1">💡 Native [!TIP] Callouts</text>

    <rect x="20" y="171" width="200" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="192" font-family="monospace" font-size="11" fill="#cbd5e1">🎨 Dual Light/Dark Shiki</text>

    <rect x="20" y="214" width="200" height="30" rx="6" fill="#f43f5e" opacity="0.2" />
    <text x="120" y="233" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#fb7185">&lt; 1s Build Time</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <g transform="translate(610, 245)">
    <line x1="0" y1="0" x2="40" y2="0" stroke="#f43f5e" stroke-width="3" stroke-dasharray="4 4" />
    <polygon points="45,0 35,-6 35,6" fill="#f43f5e" />
  </g>

  <!-- Step 3: Production Edge Delivery Card -->
  <g transform="translate(660, 130)">
    <rect width="240" height="260" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="2" filter="url(#glow)" opacity="0.9" />
    <rect width="240" height="260" rx="12" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.5" />
    <circle cx="40" cy="40" r="18" fill="#10b981" opacity="0.15" />
    <text x="40" y="46" text-anchor="middle" font-size="18">🌐</text>
    <text x="70" y="44" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#f8fafc">Production Edge</text>
    <text x="70" y="60" font-family="monospace" font-size="11" fill="#10b981">Vercel / Cloudflare</text>

    <!-- Sub-items -->
    <rect x="20" y="85" width="200" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="106" font-family="monospace" font-size="11" fill="#cbd5e1">📖 Sticky TOC Sidebar</text>

    <rect x="20" y="128" width="200" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="149" font-family="monospace" font-size="11" fill="#cbd5e1">🔊 Web Speech Narration</text>

    <rect x="20" y="171" width="200" height="34" rx="6" fill="#0f172a" stroke="#334155" />
    <text x="32" y="192" font-family="monospace" font-size="11" fill="#cbd5e1">🍃 ScatterLeaf Comments</text>

    <rect x="20" y="214" width="200" height="30" rx="6" fill="#10b981" opacity="0.2" />
    <text x="120" y="233" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#34d399">100/100 Lighthouse</text>
  </g>

  <!-- Bottom Badges -->
  <g transform="translate(480, 440)">
    <text x="0" y="0" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#64748b">
      Pure Static HTML • Zero Hydration Bloat • Fully Responsive
    </text>
  </g>
</svg>
