<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#1c1d22" />
    </linearGradient>
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262830" />
      <stop offset="100%" stop-color="#1e1f26" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)" />

  <!-- Accent ambient spheres -->
  <circle cx="200" cy="150" r="140" fill="#a3b18a" opacity="0.12" filter="url(#softGlow)" />
  <circle cx="1000" cy="480" r="180" fill="#d4a373" opacity="0.10" filter="url(#softGlow)" />

  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-width="1" opacity="0.04">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Header Badge -->
  <rect x="80" y="70" width="160" height="34" rx="17" fill="#2d303b" stroke="#3e4352" stroke-width="1" />
  <circle cx="98" cy="87" r="5" fill="#a3b18a" />
  <text x="114" y="93" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e0e0e0" letter-spacing="1">DESIGN SYSTEM</text>

  <!-- Main Title -->
  <text x="80" y="150" font-family="Georgia, serif" font-size="44" font-weight="bold" fill="#f4edea">Minrock Typography &amp; Architecture</text>
  <text x="80" y="188" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" fill="#a0a4b0">Four harmonious themes, fluid reading hierarchy, and zero layout shift.</text>

  <!-- Theme Cards -->
  <!-- Card 1: Cream -->
  <g transform="translate(80, 240)">
    <rect width="235" height="280" rx="14" fill="#faf8f5" stroke="#e3ded7" stroke-width="1.5" />
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#888279" letter-spacing="1">PALETTE 01</text>
    <text x="24" y="78" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#2b2825">Cream</text>
    <rect x="24" y="100" width="187" height="40" rx="8" fill="#f0ece4" />
    <text x="36" y="125" font-family="monospace" font-size="12" fill="#59544c">Warm Natural Paper</text>
    <circle cx="44" cy="180" r="16" fill="#8b5e34" />
    <circle cx="88" cy="180" r="16" fill="#2b2825" />
    <circle cx="132" cy="180" r="16" fill="#d4a373" />
    <circle cx="176" cy="180" r="16" fill="#faf8f5" stroke="#ccc" stroke-width="1" />
    <text x="24" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#666">Editorial classic tone</text>
  </g>

  <!-- Card 2: Dark -->
  <g transform="translate(345, 240)">
    <rect width="235" height="280" rx="14" fill="#141416" stroke="#2c2d33" stroke-width="1.5" />
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#757885" letter-spacing="1">PALETTE 02</text>
    <text x="24" y="78" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#f0f0f3">Dark</text>
    <rect x="24" y="100" width="187" height="40" rx="8" fill="#212228" />
    <text x="36" y="125" font-family="monospace" font-size="12" fill="#a6a9b6">Deep OLED Contrast</text>
    <circle cx="44" cy="180" r="16" fill="#a3b18a" />
    <circle cx="88" cy="180" r="16" fill="#f0f0f3" />
    <circle cx="132" cy="180" r="16" fill="#3a3d47" />
    <circle cx="176" cy="180" r="16" fill="#141416" stroke="#555" stroke-width="1" />
    <text x="24" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#888">High legibility at night</text>
  </g>

  <!-- Card 3: Matcha -->
  <g transform="translate(610, 240)">
    <rect width="235" height="280" rx="14" fill="#f4f7f4" stroke="#d5e0d5" stroke-width="1.5" />
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#587058" letter-spacing="1">PALETTE 03</text>
    <text x="24" y="78" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#1e2e1e">Matcha</text>
    <rect x="24" y="100" width="187" height="40" rx="8" fill="#e4ebe4" />
    <text x="36" y="125" font-family="monospace" font-size="12" fill="#3c523c">Organic Botanical</text>
    <circle cx="44" cy="180" r="16" fill="#588157" />
    <circle cx="88" cy="180" r="16" fill="#1e2e1e" />
    <circle cx="132" cy="180" r="16" fill="#a3b18a" />
    <circle cx="176" cy="180" r="16" fill="#f4f7f4" stroke="#ccc" stroke-width="1" />
    <text x="24" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#556">Calming forest tones</text>
  </g>

  <!-- Card 4: Light -->
  <g transform="translate(875, 240)">
    <rect width="235" height="280" rx="14" fill="#ffffff" stroke="#e0e0e0" stroke-width="1.5" />
    <text x="24" y="44" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" fill="#777" letter-spacing="1">PALETTE 04</text>
    <text x="24" y="78" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#111">Light</text>
    <rect x="24" y="100" width="187" height="40" rx="8" fill="#f4f4f6" />
    <text x="36" y="125" font-family="monospace" font-size="12" fill="#444">Crisp Modern Studio</text>
    <circle cx="44" cy="180" r="16" fill="#2563eb" />
    <circle cx="88" cy="180" r="16" fill="#111111" />
    <circle cx="132" cy="180" r="16" fill="#93c5fd" />
    <circle cx="176" cy="180" r="16" fill="#ffffff" stroke="#ccc" stroke-width="1" />
    <text x="24" y="240" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" fill="#666">Minimalist monochrome</text>
  </g>
</svg>
