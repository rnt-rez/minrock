name: Execute Audit Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  audit:
    name: Run `npm run audit:${{ matrix.script }}`
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        script:
          - wcag
          - security
          - google
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Run `npm run audit:${{ matrix.script }}`
        run: npm run audit:${{ matrix.script }}
